services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - base44_npm_cache:/root/.npm
    command: npx --yes vite@6.4.1 --host 0.0.0.0 --port 3000
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS}
    ports:
      - "3000:3000"

volumes:
  base44_npm_cache:
