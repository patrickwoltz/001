<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento de Criptomoedas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f6f0;
    --card-bg: #ffffff;
    --line: #e8e4dc;
    --text: #1a1a1a;
    --muted: #8c857b;
    --muted-light: #b5afa6;
    --up: #10b981;
    --down: #ef4444;
    --blue: #2563eb;
    --box-bg: #f3efe6;
  }
  
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px 20px;
  }

  .container {
    max-width: 980px;
    margin: 0 auto;
  }

  /* Header e Relógio */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .status-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .status .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted-light);
  }

  .status.live .led {
    background: #f97316; /* Bolinha Laranja */
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }

  .last-fetch {
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Tabela de Ativos */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted-light);
    letter-spacing: 0.05em;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    text-transform: uppercase;
  }

  td {
    padding: 16px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  tr:nth-child(even) {
    background-color: rgba(255, 255, 255, 0.4);
  }

  .col-num {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted-light);
    font-size: 13px;
    width: 40px;
  }

  .asset-cell {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .symbol-box {
    width: 42px;
    height: 42px;
    background: var(--box-bg);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    border-radius: 2px;
  }

  .asset-info .name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: block;
  }

  .asset-info .ticker {
    font-size: 12px;
    color: var(--muted-light);
    font-family: 'IBM Plex Mono', monospace;
  }

  .price {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
  }

  .change {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
  }

  .change.up { color: var(--up); }
  .change.down { color: var(--down); }

  .market-cap {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  /* Botão Trocar */
  .btn-swap {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 8px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-swap:hover {
    border-color: var(--muted);
    color: var(--text);
  }

  .btn-swap.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: #ffffff;
  }

  .btn-swap.primary:hover {
    background: #1d4ed8;
  }

  .actions {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .btn-refresh {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 10px 20px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }

  .btn-refresh:hover {
    border-color: var(--muted);
    color: var(--text);
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="status-group">
      <div class="status live" id="status">
        <span class="led"></span>
        <span id="clockDisplay">00:00:00</span>
      </div>
    </div>
    <div class="last-fetch" id="lastFetchText">Carregando cotações...</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Ativo</th>
          <th>Preço</th>
          <th>24H</th>
          <th>Cap. Mercado</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="cryptoTable">
        <!-- Linhas dinâmicas -->
      </tbody>
    </table>
  </div>

  <div class="actions">
    <button class="btn-refresh" id="refreshBtn">Atualizar agora</button>
  </div>
</div>

<script>
const ASSETS = [
  { id: 'bitcoin', symbol: 'BTC', name: 'Bitcoin', num: '01', isPrimary: true },
  { id: 'ethereum', symbol: 'ETH', name: 'Ethereum', num: '02' },
  { id: 'solana', symbol: 'SOL', name: 'Solana', num: '03' },
  { id: 'binancecoin', symbol: 'BNB', name: 'BNB', num: '04' },
  { id: 'ripple', symbol: 'XRP', name: 'XRP', num: '05' }
];

const fmtBRL = n => 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function formatCap(n) {
  if (n >= 1e12) return 'R$ ' + (n / 1e12).toFixed(1).replace('.', ',') + ' tri';
  if (n >= 1e9) return 'R$ ' + (n / 1e9).toFixed(1).replace('.', ',') + ' bi';
  return 'R$ ' + (n / 1e6).toFixed(1).replace('.', ',') + ' mi';
}

function startClock() {
  const clockEl = document.getElementById('clockDisplay');
  function update() {
    clockEl.textContent = new Date().toLocaleTimeString('pt-BR');
  }
  update();
  setInterval(update, 1000);
}

async function loadData() {
  const lastFetchText = document.getElementById('lastFetchText');
  lastFetchText.textContent = 'Buscando cotações...';

  try {
    const ids = ASSETS.map(a => a.id).join(',');
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=brl&include_24hr_change=true&include_market_cap=true`);
    
    if (!res.ok) throw new Error('Erro HTTP ' + res.status);
    const data = await res.json();

    const tbody = document.getElementById('cryptoTable');
    tbody.innerHTML = '';

    ASSETS.forEach(asset => {
      const info = data[asset.id];
      if (!info) return;

      const price = info.brl;
      const change = info.brl_24h_change;
      const mcap = info.brl_market_cap;

      const isUp = change >= 0;
      const changeClass = isUp ? 'up' : 'down';
      const changeSign = isUp ? '+' : '';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="col-num">${asset.num}</td>
        <td>
          <div class="asset-cell">
            <div class="symbol-box">${asset.symbol}</div>
            <div class="asset-info">
              <span class="name">${asset.name}</span>
              <span class="ticker">${asset.symbol}</span>
            </div>
          </div>
        </td>
        <td class="price">${fmtBRL(price)}</td>
        <td class="change ${changeClass}">${changeSign}${change.toFixed(2)}%</td>
        <td class="market-cap">${formatCap(mcap)}</td>
        <td>
          <button class="btn-swap ${asset.isPrimary ? 'primary' : ''}">Trocar</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    lastFetchText.textContent = 'Última atualização às ' + new Date().toLocaleTimeString('pt-BR');
  } catch (err) {
    lastFetchText.textContent = 'Falha ao carregar dados: ' + err.message;
  }
}

startClock();
loadData();
document.getElementById('refreshBtn').addEventListener('click', loadData);
setInterval(loadData, 60000);
</script>

</body>
</html>
