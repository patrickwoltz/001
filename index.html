<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto & Gold Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Adaptador de Data para Chart.js (date-fns) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4 md:p-8 transition-colors">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header & Status -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Crypto & Gold Tracker</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400">Acompanhamento comparativo em tempo real</p>
            </div>
            <div id="api-status" class="text-xs px-3 py-1.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium">
                Carregando dados...
            </div>
        </header>

        <!-- Controles do Gráfico -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-4 border-b border-slate-100 dark:border-slate-700 pb-4">
                
                <!-- Seleção de Métrica -->
                <div class="flex bg-slate-100 dark:bg-slate-700/50 p-1 rounded-xl">
                    <button onclick="changeMetric('price', event)" class="metric-btn px-4 py-1.5 rounded-lg text-sm font-semibold bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm transition">
                        Preço (USD)
                    </button>
                    <button onclick="changeMetric('ratio', event)" class="metric-btn px-4 py-1.5 rounded-lg text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
                        Ratio BTC / XAUt
                    </button>
                </div>

                <!-- Seleção de Período -->
                <div class="flex flex-wrap bg-slate-100 dark:bg-slate-700/50 p-1 rounded-xl gap-1 text-xs md:text-sm">
                    <button onclick="changeChartPeriod('24h', event)" class="chart-btn px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">24h</button>
                    <button onclick="changeChartPeriod('7d', event)" class="chart-btn px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">7d</button>
                    <button onclick="changeChartPeriod('1m', event)" class="chart-btn px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">1m</button>
                    <button onclick="changeChartPeriod('3m', event)" class="chart-btn px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">3m</button>
                    <button onclick="changeChartPeriod('ytd', event)" class="chart-btn px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">YTD</button>
                    <button onclick="changeChartPeriod('1a', event)" class="chart-btn px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">1A</button>
                    <button onclick="changeChartPeriod('max', event)" class="chart-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-semibold shadow-sm transition">Máx</button>
                </div>
            </div>

            <!-- Canvas do Gráfico -->
            <div class="relative h-80 md:h-96 w-full">
                <canvas id="trackerChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Variáveis de Estado
        let rawBtcData = [];
        let rawXautData = [];
        let currentPeriod = 'max';
        let currentMetric = 'price';
        let chartInstance = null;

        const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            loadTrackerData();
            // Atualiza a cada 5 minutos para respeitar a cota pública da CoinGecko
            setInterval(loadTrackerData, 300000); 
        });

        // 1. Busca de Dados com tratamento de Rate Limit (HTTP 429)
        async function fetchMarketChart(coinId) {
            const url = `https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=usd&days=365`;
            const response = await fetch(url);
            
            if (response.status === 429) {
                throw new Error("Limite de requisições atingido (CoinGecko 429). Aguarde alguns instantes.");
            }
            if (!response.ok) {
                throw new Error(`Erro ao obter dados da moeda ${coinId}: Status ${response.status}`);
            }
            
            const data = await response.json();
            // Mapeia array [[timestamp, price], ...] em array de objetos [{x: timestamp, y: price}]
            return data.prices.map(item => ({ x: item[0], y: item[1] }));
        }

        async function loadTrackerData() {
            const statusEl = document.getElementById('api-status');
            try {
                statusEl.textContent = "Atualizando dados...";
                statusEl.className = "text-xs px-3 py-1.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 font-medium";

                rawBtcData = await fetchMarketChart('bitcoin');
                await delay(1500); // Pausa entre requisições para mitigar rate-limit
                rawXautData = await fetchMarketChart('tether-gold');

                statusEl.textContent = "Dados atualizados";
                statusEl.className = "text-xs px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300 font-medium";

                renderChart();
            } catch (err) {
                console.error(err);
                statusEl.textContent = err.message || "Erro na conexão com API";
                statusEl.className = "text-xs px-3 py-1.5 rounded-full bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300 font-medium";
            }
        }

        // 2. Filtragem de Períodos por Timestamp em Milissegundos
        function filterSeries(arr, period) {
            if (!arr || arr.length === 0) return [];
            
            const now = Date.now();
            const DAY_MS = 86400000;

            switch (period) {
                case '24h': return arr.filter(item => (now - item.x) <= DAY_MS);
                case '7d':  return arr.filter(item => (now - item.x) <= 7 * DAY_MS);
                case '1m':  return arr.filter(item => (now - item.x) <= 30 * DAY_MS);
                case '3m':  return arr.filter(item => (now - item.x) <= 90 * DAY_MS);
                case 'ytd': {
                    const startOfYear = new Date(new Date().getFullYear(), 0, 1).getTime();
                    return arr.filter(item => item.x >= startOfYear);
                }
                case '1a':  return arr.filter(item => (now - item.x) <= 365 * DAY_MS);
                default:   return arr; // 'max'
            }
        }

        // 3. Cálculo de Ratio Sync (BTC / XAUt por aproximação de timestamp)
        function calculateRatioSeries(btcArr, xautArr) {
            if (!btcArr.length || !xautArr.length) return [];
            
            const ratioData = [];
            // Itera pela série BTC e encontra o ponto no tempo mais próximo no XAUt
            btcArr.forEach(btcPoint => {
                const closestXaut = xautArr.reduce((prev, curr) => 
                    Math.abs(curr.x - btcPoint.x) < Math.abs(prev.x - btcPoint.x) ? curr : prev
                );
                
                // Tolera no máximo 1 dia de variação temporal entre as duas pontas
                if (closestXaut && Math.abs(closestXaut.x - btcPoint.x) < 86400000) {
                    ratioData.push({
                        x: btcPoint.x,
                        y: btcPoint.y / closestXaut.y
                    });
                }
            });
            return ratioData;
        }

        // 4. Configuração Inicial do Chart.js com Escala Temporal
        function initChart() {
            const ctx = document.getElementById('trackerChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                tooltipFormat: 'dd/MM/yyyy HH:mm',
                                displayFormats: {
                                    hour: 'HH:mm',
                                    day: 'dd MMM',
                                    month: 'MMM yyyy'
                                }
                            },
                            grid: { display: false }
                        },
                        y: {
                            position: 'left',
                            grid: { color: 'rgba(148, 163, 184, 0.1)' }
                        },
                        y1: {
                            position: 'right',
                            display: false,
                            grid: { drawOnChartArea: false }
                        }
                    },
                    plugins: {
                        legend: { position: 'top' }
                    }
                }
            });
        }

        // 5. Renderização do Gráfico
        function renderChart() {
            if (!chartInstance) return;

            const filteredBtc = filterSeries(rawBtcData, currentPeriod);
            const filteredXaut = filterSeries(rawXautData, currentPeriod);

            if (currentMetric === 'price') {
                chartInstance.data.datasets = [
                    {
                        label: 'Bitcoin (USD)',
                        data: filteredBtc,
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Tether Gold (USD)',
                        data: filteredXaut,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        yAxisID: 'y1'
                    }
                ];
                chartInstance.options.scales.y1.display = true; // Exibe eixo secundário para XAUt
            } else {
                const ratioData = calculateRatioSeries(filteredBtc, filteredXaut);
                chartInstance.data.datasets = [
                    {
                        label: 'Ratio BTC / XAUt',
                        data: ratioData,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        yAxisID: 'y'
                    }
                ];
                chartInstance.options.scales.y1.display = false;
            }

            chartInstance.update();
        }

        // 6. Manipulação dos Eventos de Interface (Usando currentTarget)
        function changeChartPeriod(period, evt) {
            currentPeriod = period;
            document.querySelectorAll('.chart-btn').forEach(btn => {
                btn.className = "chart-btn px-3 py-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition";
            });
            evt.currentTarget.className = "chart-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-semibold shadow-sm transition";
            renderChart();
        }

        function changeMetric(metric, evt) {
            currentMetric = metric;
            document.querySelectorAll('.metric-btn').forEach(btn => {
                btn.className = "metric-btn px-4 py-1.5 rounded-lg text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition";
            });
            evt.currentTarget.className = "metric-btn px-4 py-1.5 rounded-lg text-sm font-semibold bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm transition";
            renderChart();
        }
    </script>
</body>
</html>
